<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Filled in by the server: where replay runs. See `replay_viewer`. -->
  <meta name="indice-replay-origin" content="{{replay_origin}}">
  <!-- Filled in by the server: what to replay, from the address. -->
  <script type="application/json" id="replay-context">{{replay_context}}</script>
  <!-- Filled in by the server: the sentences the scripts show, in the page's language. -->
  <script type="application/json" id="i18n">{{strings}}</script>
  <title>{{title}}</title>
  <!--
    The replay viewer: indice's chrome and the notes panel, around a frame that
    holds the replay itself (/replay-frame). Every API call happens on this
    page, never in the frame, because archived pages run their own JavaScript
    in the frame's origin. Messages from the frame are therefore suggestions:
    see viewer.js and annotations.js.
  -->
  <script src="/assets/i18n.js"></script>
  <script src="/replay/annotations.js"></script>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/assets/tokens.css">
  <link rel="stylesheet" href="/replay/annotations.css">
  <link rel="stylesheet" href="/replay/viewer.css">
  <!-- Filled in by the server: the operator's analytics snippet, if any. -->
  {{analytics_head}}
</head>
<body>
  <div id="banner">
    <a class="home" href="/">{{site_name}}</a>
    <span class="sep" id="collection-sep">/</span>
    <a id="collection"></a>
    <span class="sep" id="crawl-sep">/</span>
    <a id="collection-name"></a>
    <span id="captured"></span>
    <span id="current-url"></span>
    <button type="button" id="anno-toggle" aria-expanded="true">{{notes_label}}</button>
  </div>
  <div id="stage">
    <div id="replay-container">
      <div id="replay-loading" role="status">
        <span class="spinner" aria-hidden="true"></span>
        <span id="replay-loading-text">{{loading_text}}</span>
      </div>
    </div>
    <aside id="anno-panel"></aside>
  </div>

  <script src="/replay/viewer.js"></script>
</body>
</html>
