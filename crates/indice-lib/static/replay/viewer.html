<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Replay</title>
  <!--
    The replay viewer: indice's chrome and the notes panel, around a frame that
    holds the replay itself (/replay-frame). Every API call happens on this
    page, never in the frame, because archived pages run their own JavaScript
    in the frame's origin. Messages from the frame are therefore suggestions:
    see the channel below and annotations.js.
  -->
  <script src="annotations.js"></script>
  <link rel="stylesheet" href="annotations.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; font-family: sans-serif; }

    /* Matches the app header (.appbar): light, hairline, wordmark + breadcrumb.
       Values mirror app.css tokens (viewer.html is standalone, so no CSS vars). */
    #banner {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1rem;
      background: #fff;
      color: #1a1a1a;
      font-size: 0.85rem;
      border-bottom: 1px solid #e7e3db;
      /* Sit above the replayed page (isolated in its iframe below) with a soft
         shadow, so the banner always reads as indice's chrome regardless of the
         archived page's own background. */
      position: relative;
      z-index: 1;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }
    #banner a.home {
      color: #1a1a1a;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.01em;
      text-decoration: none;
    }
    #banner .sep { color: #cfcabf; }
    #banner a#collection,
    #banner a#collection-name {
      color: #0053a6;
      text-decoration: none;
      white-space: nowrap;
    }
    #banner a#collection:hover,
    #banner a#collection-name:hover { text-decoration: underline; }
    #current-url {
      color: #8f8b83;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
      margin-left: 0.3rem;
    }

    #stage { flex: 1 1 auto; display: flex; min-height: 0; position: relative; }
    #replay-container { flex: 1 1 auto; position: relative; min-height: 0; min-width: 0; }
    #replay-frame { display: block; width: 100%; height: 100%; border: 0; }
    #error { padding: 2rem; color: #c00; }
  </style>
</head>
<body>
  <div id="banner">
    <a class="home" href="/">indice</a>
    <span class="sep">/</span>
    <a id="collection"></a>
    <span class="sep" id="collection-sep">/</span>
    <a id="collection-name"></a>
    <span id="current-url"></span>
    <button type="button" id="anno-toggle" aria-expanded="true">Notes</button>
  </div>
  <div id="stage">
    <div id="replay-container"></div>
    <aside id="anno-panel"></aside>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const source = params.get('source'); // e.g. /files/a926c132
      const url    = params.get('url') || '';
      const name   = params.get('name') || '';
      const collection   = params.get('collection') || '';
      const collectionId = params.get('collection_id') || '';
      const crawlId      = params.get('crawl') || '';

      if (!source) {
        document.body.innerHTML =
          '<div id="error">Missing <code>source</code> parameter.</div>';
        return;
      }

      // Breadcrumb: indice › <collection> › <crawl name> › <url>. The
      // collection crumb links to its collection page, and the crawl crumb to the
      // crawl detail page, when their ids are known.
      const collEl = document.getElementById('collection');
      if (collection) {
        collEl.textContent = collection;
        if (collectionId) collEl.href = '/collection/' + encodeURIComponent(collectionId);
      } else {
        collEl.style.display = 'none';
        document.getElementById('collection-sep').style.display = 'none';
      }
      const nameEl = document.getElementById('collection-name');
      // Without a name, the same fallback the frame uses for wabac's collection
      // id: a collection's manifest ends in the shared "replay.json", so show
      // the collection id rather than that.
      nameEl.textContent = name || params.get('coll') ||
        (source.endsWith('/replay.json') ? (collectionId || 'collection') : source.split('/').pop());
      if (crawlId) nameEl.href = '/crawl/' + encodeURIComponent(crawlId);
      const currentUrl = document.getElementById('current-url');
      currentUrl.textContent = url;

      // The frame's origin. The server names it when replay runs on its own
      // origin; otherwise it is this page's. Taken from configuration and never
      // from a message, because the check below is what everything trusting a
      // message depends on.
      const meta = document.querySelector('meta[name="indice-replay-origin"]');
      const frameOrigin = (meta && meta.content) || window.location.origin;

      const frameParams = new URLSearchParams(params);
      frameParams.set('parent', window.location.origin);
      const frame = document.createElement('iframe');
      frame.id = 'replay-frame';
      frame.title = 'Archived page';
      frame.allow = 'fullscreen';
      frame.src = frameOrigin + '/replay-frame?' + frameParams.toString();
      document.getElementById('replay-container').appendChild(frame);

      // The channel to the frame, and the one place its messages are checked.
      // A message counts only if it comes from our own frame and from the
      // origin we put it on; valid ones are re-dispatched as `indice-replay`
      // events for the banner and the notes panel. Even a valid one is only a
      // suggestion: archived script shares the frame's origin and can send
      // anything the frame's agent can.
      window.indiceReplay = {
        send: function (type, payload) {
          if (!frame.contentWindow) return;
          frame.contentWindow.postMessage(
            Object.assign({ indice: 'replay', type: type }, payload),
            frameOrigin
          );
        },
      };
      window.addEventListener('message', function (e) {
        if (e.source !== frame.contentWindow || e.origin !== frameOrigin) return;
        const d = e.data;
        if (!d || d.indice !== 'replay' || typeof d.type !== 'string') return;
        window.dispatchEvent(new CustomEvent('indice-replay', { detail: d }));
      });

      // Keep the banner URL in step as the reader navigates the archive.
      window.addEventListener('indice-replay', function (e) {
        const d = e.detail;
        if (d.type === 'url' && typeof d.url === 'string' && d.url) {
          currentUrl.textContent = d.url;
        }
      });
    })();
  </script>
</body>
</html>
