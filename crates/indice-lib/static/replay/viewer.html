<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Filled in by the server: where replay runs. See `replay_viewer`. -->
  <meta name="indice-replay-origin" content="{{replay_origin}}">
  <title>Replay</title>
  <!--
    The replay viewer: indice's chrome and the notes panel, around a frame that
    holds the replay itself (/replay-frame). Every API call happens on this
    page, never in the frame, because archived pages run their own JavaScript
    in the frame's origin. Messages from the frame are therefore suggestions:
    see viewer.js and annotations.js.
  -->
  <script src="annotations.js"></script>
  <link rel="stylesheet" href="annotations.css">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div id="banner">
    <a class="home" href="/">indice</a>
    <span class="sep">/</span>
    <a id="collection"></a>
    <span class="sep" id="collection-sep">/</span>
    <a id="collection-name"></a>
    <span id="current-url"></span>
    <button type="button" id="anno-toggle" aria-expanded="true">Notes</button>
  </div>
  <div id="stage">
    <div id="replay-container"></div>
    <aside id="anno-panel"></aside>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
