<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Replay</title>
  <script src="ui.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; font-family: sans-serif; }

    /* Matches the app header (.appbar): light, hairline, wordmark + breadcrumb.
       Values mirror app.css tokens (viewer.html is standalone, so no CSS vars). */
    #banner {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1rem;
      background: #fff;
      color: #1a1a1a;
      font-size: 0.85rem;
      border-bottom: 1px solid #e7e3db;
      /* Sit above the replayed page (isolated in its iframe below) with a soft
         shadow, so the banner always reads as indice's chrome regardless of the
         archived page's own background. */
      position: relative;
      z-index: 1;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }
    #banner a.home {
      color: #1a1a1a;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.01em;
      text-decoration: none;
    }
    #banner .sep { color: #cfcabf; }
    #banner a#collection,
    #banner a#collection-name {
      color: #0053a6;
      text-decoration: none;
      white-space: nowrap;
    }
    #banner a#collection:hover,
    #banner a#collection-name:hover { text-decoration: underline; }
    #current-url {
      color: #8f8b83;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
      margin-left: 0.3rem;
    }

    #replay-container { flex: 1 1 auto; position: relative; min-height: 0; }
    replay-web-page { display: block; width: 100%; height: 100%; }
    #error { padding: 2rem; color: #c00; }
  </style>
</head>
<body>
  <div id="banner">
    <a class="home" href="/">indice</a>
    <span class="sep">/</span>
    <a id="collection"></a>
    <span class="sep" id="collection-sep">/</span>
    <a id="collection-name"></a>
    <span id="current-url"></span>
  </div>
  <div id="replay-container"></div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const source = params.get('source'); // e.g. /files/a926c132
      const url    = params.get('url') || '';
      const ts     = params.get('ts') || '';
      const name   = params.get('name') || '';
      const collection   = params.get('collection') || '';
      const collectionId = params.get('collection_id') || '';
      const crawlId      = params.get('crawl') || '';

      if (!source) {
        document.body.innerHTML =
          '<div id="error">Missing <code>source</code> parameter.</div>';
        return;
      }

      // wabac collection namespace (its IndexedDB cache key). For a multi-WACZ
      // collection manifest (…/replay.json) the last path segment is the shared
      // "replay.json", so fall back to the collection id to keep each collection
      // in its own namespace. An explicit `coll` param wins; otherwise a
      // single-WACZ source uses its last segment (the WACZ id).
      const explicitColl = params.get('coll') || '';
      let collId;
      if (explicitColl) {
        collId = explicitColl;
      } else if (source.endsWith('/replay.json')) {
        collId = collectionId || 'collection';
      } else {
        collId = source.split('/').pop();
      }

      // Breadcrumb: indice › <collection> › <crawl name> › <url>. The
      // collection crumb links to its collection page, and the crawl crumb to the
      // crawl detail page, when their ids are known.
      const collEl = document.getElementById('collection');
      if (collection) {
        collEl.textContent = collection;
        if (collectionId) collEl.href = '/collection/' + encodeURIComponent(collectionId);
      } else {
        collEl.style.display = 'none';
        document.getElementById('collection-sep').style.display = 'none';
      }
      const nameEl = document.getElementById('collection-name');
      nameEl.textContent = name || collId;
      if (crawlId) nameEl.href = '/crawl/' + encodeURIComponent(crawlId);
      document.getElementById('current-url').textContent = url;

      // Mount the ReplayWebPage component in WACZ-direct mode: it reads the
      // WACZ from `source` (our /files/{id} byte-range endpoint), extracts the
      // internal CDX into IndexedDB, and serves all resources client-side.
      const rp = document.createElement('replay-web-page');
      rp.setAttribute('source', source);
      rp.setAttribute('coll', collId);
      // Chrome-free inline replay for both single-WACZ and multi-WACZ collection
      // sources. A collection is a native multi-WACZ source: wabac loads each
      // member's CDX and resolves URLs across them itself. (ReplayWeb.page's
      // `embed=replay` full-app mode would add a Pages sidebar, but it loads its
      // own app shell and doesn't deep-link to a specific url/ts the way
      // `replayonly` does — so it can't open a chosen page. Deferred with the
      // pagesQueryUrl scale valve; see rustyweb-scale-footprint-qw5.10.)
      rp.setAttribute('embed', 'replayonly');
      // Absolute base so the SW resolves to /replay/sw.js regardless of the
      // page path. The default "./replay/" would resolve relative to
      // /replay/viewer → /replay/replay/sw.js (404).
      rp.setAttribute('replaybase', '/replay/');
      rp.setAttribute('swName', 'sw.js');
      if (url) rp.setAttribute('url', url);
      if (ts)  rp.setAttribute('ts', ts);
      document.getElementById('replay-container').appendChild(rp);

      // Keep the banner URL in sync as the user navigates within the archive.
      // ReplayWeb.page dispatches rwp-url-change on the <replay-web-page>
      // element itself, and it does not bubble, so we listen on the element
      // (not window).
      rp.addEventListener('rwp-url-change', function (e) {
        const newUrl = e.detail && e.detail.url;
        if (newUrl) {
          document.getElementById('current-url').textContent = newUrl;
        }
      });
    })();
  </script>
</body>
</html>
