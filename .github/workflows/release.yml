name: Release

# Build prebuilt binaries and attach them to a GitHub Release when a version
# tag is pushed (e.g. `git tag v0.1.0 && git push origin v0.1.0`). Each archive
# is self-contained (ReplayWeb.page assets are embedded at build time) and also
# bundles a small sample archive (samples/apod.wacz) so `indice` has something to
# index and show on first run — see the Quickstart in the README.
on:
  push:
    tags: ["v*"]

# The job creates/updates the Release and uploads assets to it.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain pinned in rust-toolchain.toml, matching CI.
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      # Cross-compiles the `indice` binary for the target (using `cross` for the
      # Linux targets), packages it as a .tar.gz (or .zip on Windows) named
      # `indice-<tag>-<target>`, bundles the sample + docs, writes a SHA-256
      # checksum, and uploads everything to the tag's GitHub Release.
      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: indice
          target: ${{ matrix.target }}
          archive: indice-$tag-$target
          include: apod.wacz,README.md,LICENSE
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
