name: Release

# Build prebuilt binaries and attach them to a GitHub Release when a version tag
# is pushed (e.g. `git tag v0.1.0 && git push origin v0.1.0`), and publish a
# multi-arch container image to GHCR.
#
# Each target builds on a native runner (GitHub-hosted macOS-arm64 and
# Linux-arm64), using actions/checkout, the pinned rustup toolchain
# (rust-toolchain.toml), and the `gh` CLI to upload — no cross-compilation.
# Linux uses the glibc (gnu) targets on Ubuntu 22.04 for a low glibc floor (broad
# portability). Each archive is self-contained (ReplayWeb.page assets are
# embedded at build time) and bundles a small sample archive (apod.wacz) — see
# the README Quickstart. Per-artifact SHA-256 checksums are published alongside.
#
# The image (ghcr.io/<owner>/indice) is built for linux/amd64 and linux/arm64,
# each on its own native runner (no QEMU), pushed by digest, then stitched into
# one multi-arch tag — using only the docker CLI and GitHub's own artifact
# actions. `:latest` tracks final releases only, not prereleases (v*-rc etc.).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the Release and upload assets

env:
  CARGO_TERM_COLOR: always
  BIN: indice

jobs:
  # Create the Release once, up front, so the parallel build jobs just upload to
  # it. It's created as a DRAFT (not public) so that if any build fails the
  # release never goes live half-populated; the `publish` job below flips it to
  # public only after every build succeeds. `|| true` keeps a re-run idempotent
  # if the draft already exists.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the draft Release (if absent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag --draft || true

  build:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain pinned in rust-toolchain.toml (matches CI), then
      # adds the target (a no-op when it's the runner's native triple).
      - name: Rust toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      # Use the GitHub expression (not a shell var) so it expands the same under
      # bash (macOS/Linux) and PowerShell (Windows) — a bare `$BIN` is empty in
      # pwsh, which made the Windows build fail with an empty `--bin`.
      - name: Build
        run: cargo build --release --locked --bin ${{ env.BIN }} --target ${{ matrix.target }}

      # Package (tar.gz), checksum, and upload with GitHub's own gh CLI.
      - name: Package and upload (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="${BIN}-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${BIN}" apod.wacz README.md LICENSE "$name/"
          tar czf "${name}.tar.gz" "$name"
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          gh release upload "$GITHUB_REF_NAME" "${name}.tar.gz" "${name}.tar.gz.sha256" --clobber

      - name: Package and upload (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "$env:BIN-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN.exe", apod.wacz, README.md, LICENSE $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash | Out-File -Encoding ascii "$name.zip.sha256"
          gh release upload $env:GITHUB_REF_NAME "$name.zip" "$name.zip.sha256" --clobber

  # ── Container image ─────────────────────────────────────────────────────────
  # Build the image for each architecture on its NATIVE runner (no QEMU
  # emulation), pushing each by digest to GHCR. buildx is bundled with the docker
  # CLI, so no third-party actions are needed; `docker-manifest` (below) combines
  # the digests into the user-visible tags.
  docker:
    needs: create-release
    name: image ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write # push to GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, os: ubuntu-22.04 }
          - { platform: linux/arm64, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push by digest
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx create --use --name indice-builder >/dev/null
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --provenance=false \
            --output "type=image,name=${image},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json \
            .
          digest=$(jq -r '."containerimage.digest"' metadata.json)
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.os }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # Assemble the per-arch digests into one multi-arch tag. `needs: [build, docker]`
  # so the visible tags appear only after the binaries AND both images built —
  # matching the draft→publish gate so a release never goes live half-built.
  docker-manifest:
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - name: Create and push the multi-arch manifest
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="$GITHUB_REF_NAME"
          # Always tag the version; add :latest only for a final release (a tag
          # with no `-` suffix — so v0.1.0 does, v0.1.0-rc1 / v0.0.1-test do not).
          tags=(-t "${image}:${version}")
          case "$version" in
            *-*) echo "prerelease ${version}: not tagging :latest" ;;
            *)   tags+=(-t "${image}:latest") ;;
          esac
          refs=()
          for d in /tmp/digests/*; do refs+=("${image}@sha256:$(basename "$d")"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "${image}:${version}"

  # Flip the draft Release to public only after every build+upload succeeded. If
  # any build failed, `needs: build` fails and this is skipped — so the release
  # stays a private draft (delete it and retry) rather than going live partial.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
