name: Pages

# Build the landing site (site/, Astro) and deploy it to GitHub Pages at
# https://indice.page/. Uses only GitHub's own actions.
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions,
# and Settings → Pages → Custom domain: indice.page. Being an apex domain, it needs
# A/AAAA (or ALIAS) records at GitHub's Pages addresses rather than a CNAME:
# 185.199.108–111.153 and 2606:50c0:8000–8003::153. A `www` CNAME to edsu.github.io
# is optional.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
