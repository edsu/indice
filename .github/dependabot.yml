version: 2
updates:
  # Rust dependencies (Cargo.toml / Cargo.lock).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Roll routine minor/patch bumps into a single PR to cut noise; major
      # (potentially breaking) bumps still come as individual PRs to review.
      cargo-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # fluent-bundle requires fluent-langneg 0.13, whose language tags are
      # unic-langid's; 0.14 takes icu-locid's, which do not fit fluent-bundle's.
      # Move it when fluent-bundle requires 0.14:
      # https://github.com/edsu/indice/issues/270
      - dependency-name: fluent-langneg
        versions: [">= 0.14"]

  # GitHub Actions used by the CI workflow.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
