[workspace]
members = [
    "crates/indice-lib",
    "crates/indice-bin",
]
resolver = "2"

[workspace.dependencies]
# HTTP server
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["compression-full", "fs", "trace"] }

# HTML templating (compile-time, type-checked)
maud = { version = "0.27", features = ["axum"] }

# Curator finding-aid prose: Markdown rendering (safe subset) + YAML front-matter.
# serde_yaml_ng is the maintained fork of the archived serde_yaml.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_yaml_ng = "0.10"

# CLI
clap = { version = "4", features = ["derive"] }

# Index storage. zstd-compression enables a zstd doc-store compressor (default
# features only ship lz4); we use it for the stored page text, which dominates
# the index — see the size/scale model in DESIGN.md.
tantivy = { version = "0.26", features = ["zstd-compression"] }

# WARC / WACZ
warc = "0.4"
zip = "8"

# URL / HTML
url = "2"
scraper = "0.27"
# Thumbnail decode/downscale for representative images (pure Rust; only the
# formats crawls typically capture for og:image).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# CLI progress bars (indexing).
indicatif = "0.18"
# Registrable-domain (public suffix list) for the cross-subdomain site: facet.
psl = "2"
# Pure-Rust language detection (fallback when a page has no <html lang>).
whatlang = "0.18"

# PDF text extraction
pdf-extract = "0.12"

# HTTP client for indexing remote WACZ files
ureq = "3"

# Temporarily redirect stdout (to silence third-party PDF extraction noise)
gag = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Static assets
rust-embed = "8"

# Parallelism
rayon = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# Base64
base64 = "0.23"

# Compression
flate2 = "1"

# Checksums
sha2 = "0.11"

# Datetime
chrono = { version = "0.4", features = ["serde"] }

# Async utilities
tokio-util = { version = "0.7", features = ["io"] }
# Bridge an mpsc receiver to a Stream for Server-Sent Events (management-mode
# add-archive progress).
tokio-stream = { version = "0.1", features = ["sync"] }
