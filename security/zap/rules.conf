# ZAP rule overrides for scan.sh, one per line: <rule id>, a tab, IGNORE, INFO,
# WARN or FAIL, a tab, and why. Each IGNORE is a finding that was triaged and
# explained; README.md has the triage. Rules not listed keep ZAP's default.
10055	IGNORE	(CSP form-action: left out on purpose; logout is a form whose POST redirects through the login service to an identity provider indice cannot name. See SecurityHeaders::app)
10202	IGNORE	(Anti-CSRF tokens: writes are guarded by the Origin check instead, server::auth::same_origin_guard, pinned by tests/manage.rs)
10095	IGNORE	(Backup file disclosure: /crawl/<id>/<timestamp>/<url> is the replay viewer for any archived address, so every guessed name answers)
10096	IGNORE	(Unix timestamps: capture times and ids of archived records, which a finding aid shows on purpose)
10106	IGNORE	(HTTP only: this test stack has no TLS; the shipped Caddyfile serves HTTPS with HSTS)
40025	IGNORE	(Proxy disclosure: this stack's Caddy, not indice)
10110	IGNORE	(Dangerous JS functions: eval in the vendored ReplayWeb.page ui.js, on the replay origin, which exists to run archived pages' code)
90027	IGNORE	(Cookie slack: indice_session only records who to show as signed in; identity comes from the proxy on every request)
